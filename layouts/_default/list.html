{{ define "main" }}
  <header class="page-header">
    <div class="container narrow">
      <p class="eyebrow">{{ .Section | humanize }}</p>
      <h1>{{ .Title }}</h1>
      {{ with .Description }}<p class="page-lead">{{ . }}</p>{{ end }}
      {{ with .Content }}<div class="prose intro-content">{{ . }}</div>{{ end }}
    </div>
  </header>
  <section class="section section-list">
    <div class="container">
      <div class="card-grid">
        {{ range .Paginator.Pages }}{{ partial "card.html" . }}{{ end }}
      </div>
      {{ template "_internal/pagination.html" . }}
    </div>
  </section>
{{ end }}
