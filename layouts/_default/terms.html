{{ define "main" }}
  <header class="page-header"><div class="container narrow"><h1>{{ .Title }}</h1></div></header>
  <section class="section"><div class="container narrow"><ul class="term-list">
    {{ range .Data.Terms.ByCount }}<li><a href="{{ .Page.RelPermalink }}"><span>{{ .Page.LinkTitle }}</span><span>{{ .Count }}</span></a></li>{{ end }}
  </ul></div></section>
{{ end }}
