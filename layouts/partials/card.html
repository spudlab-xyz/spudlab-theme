<article class="card">
  <div class="card-meta">
    {{ with .Params.status }}<span class="status">{{ . }}</span>{{ end }}
    {{ if not .Date.IsZero }}<time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format (site.Params.dateFormat | default "2 January 2006") }}</time>{{ end }}
  </div>
  <h3><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h3>
  <p>{{ .Description | default .Summary | plainify | truncate 180 }}</p>
  <a class="card-link" href="{{ .RelPermalink }}">{{ i18n "readMore" }}<span aria-hidden="true"> →</span><span class="sr-only">: {{ .LinkTitle }}</span></a>
</article>
